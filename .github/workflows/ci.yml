name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (strict, no any)
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

      - name: Verify the app bundles
        run: npx expo export --platform android --output-dir dist

      - name: Report bundle size
        run: node scripts/bundle-size.js
